[package]
name = "ph-curves"
version = "0.2.0"
edition = "2024"
rust-version = "1.92.0"
description = "no-std, no-alloc curve lookup tables and tickless scheduling for embedded Rust"
authors = ["Steven Giacomelli <steve@giacomelli.ca>"]
license = "MIT"
repository = "https://github.com/photon-circus/ph-curves"
documentation = "https://docs.rs/ph-curves"
readme = "README.md"
keywords = ["no-std", "embedded", "curves", "lut", "easing"]
categories = ["no-std", "embedded", "mathematics"]
exclude = [
    ".github/",
    ".gitattributes",
    ".gitignore",
    "clippy.toml",
    "rust-toolchain.toml"
]

[features]
# Links `std` into the crate for host-side code. Never enable this for
# firmware: the runtime API is no-std and no-alloc, and stays that way whether
# or not this is on — see the `#![no_std]` note in src/lib.rs.
std = []
# Host code-generation library for build.rs and tooling (serde + toml, no clap).
gen-lib = ["std", "dep:serde", "dep:toml"]
# The `ph-curves-gen` CLI binary.
gen-cli = ["gen-lib", "dep:clap"]
# 0.1.x compatibility. In 0.1.x, `gen` built the CLI; it still does.
# Prefer `gen-lib` from a build script — it skips the clap dependency.
gen = ["gen-cli"]

[dependencies]
fixed = { version = "1", default-features = false }

# Host-only deps for the `gen` / `gen-cli` features.
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "ph-curves-gen"
path = "src/bin/gen/main.rs"
required-features = ["gen-cli"]