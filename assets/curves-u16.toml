# Resolution-neutral curve definitions for the README's full-domain u16
# generator example. Builtins and formulas use normalized `t`, so the same
# source is valid at 256 or 65,536 samples. Absolute control-point coordinates
# belong in a resolution-specific document instead.

[curves.linear]
builtin = "linear"

[curves.gamma_22]
formula = "pow(t, 2.2)"

[curves.sine_ease]
formula = "(1.0 - cos(t * pi)) / 2.0"
