name: CI

# `push` is limited to the default branch on purpose. A branch that also has
# an open PR fires both `push` and `pull_request`, and those carry different
# `github.ref` values (`refs/heads/...` vs `refs/pull/N/merge`), so a
# concurrency group cannot collapse them -- they are simply two runs of the
# same commit. Building the matrix twice doubled the simultaneous
# unauthenticated GitHub API calls from the Xtensa toolchain installer, which
# tripped anonymous rate limiting (403) and reported a green commit as red.
#
# Every non-default branch is therefore covered by its pull request, which is
# the merge gate anyway. A release branch with no PR open does not build; open
# the PR to get coverage.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]

# Supersede in-flight runs when a branch or PR is pushed again. This does not
# deduplicate push-vs-pull_request (see above); it stops rapid pushes stacking.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repository. Jobs that need the automatic
# token inherit this least-privilege baseline explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
          components: rustfmt
      - run: cargo fmt --all --check

  # The crate's reason to exist: firmware gets deterministic, allocation-free
  # lookup and scheduling. This job is what makes that a guarantee rather than
  # an intention, so it must stay ahead of the feature-matrix jobs.
  runtime-purity:
    name: Runtime is no_std + no_alloc
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabi
          - thumbv6m-none-eabi
          - riscv32imc-unknown-none-elf
          - msp430-none-elf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A feature-conditional `no_std` would let Cargo's feature unification
      # turn a firmware build into a std build when some unrelated crate in the
      # graph enables a host feature. The attribute must be unconditional.
      - name: '#![no_std] must be unconditional'
        run: |
          if grep -nE '^#!\[cfg_attr\(.*no_std' src/lib.rs; then
            echo "::error file=src/lib.rs::#![no_std] is feature-conditional. The runtime no-std guarantee must not depend on feature resolution."
            exit 1
          fi
          if ! grep -qxF '#![no_std]' src/lib.rs; then
            echo "::error file=src/lib.rs::src/lib.rs must declare an unconditional #![no_std]."
            exit 1
          fi

      # Linking std at the crate root, or importing its macros there, makes a
      # host feature capable of hiding an accidental runtime allocation. Keep
      # the host link explicit and module-local under src/gen.
      - name: std must remain module-local
        run: |
          if grep -nE '^[[:space:]]*(pub(\([^)]*\))?[[:space:]]+)?extern[[:space:]]+crate[[:space:]]+std([^[:alnum:]_]|$)' src/lib.rs; then
            echo "::error file=src/lib.rs::std must not be linked at the crate root; keep it module-local under src/gen."
            exit 1
          fi
          if grep -nE '^[[:space:]]*#[[:space:]]*\[[[:space:]]*macro_use([[:space:]]|\]|\()' src/lib.rs; then
            echo "::error file=src/lib.rs::#[macro_use] is forbidden at the crate root because it can expose allocating macros to runtime modules."
            exit 1
          fi
          if grep -nE '^[[:space:]]*#[[:space:]]*\[[[:space:]]*macro_use([[:space:]]|\]|\()' src/gen/mod.rs; then
            echo "::error file=src/gen/mod.rs::link std explicitly without #[macro_use]; host modules import only what they use."
            exit 1
          fi
          if ! grep -qE '^[[:space:]]*extern[[:space:]]+crate[[:space:]]+std;[[:space:]]*$' src/gen/mod.rs; then
            echo "::error file=src/gen/mod.rs::src/gen/mod.rs must link std module-locally."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Builds the sysroot from `core` alone. If anything on the default-feature
      # path reached for `alloc` or `std` — directly or through a dependency —
      # this fails to compile. That is the no-alloc proof; a plain
      # `--target` build only proves no-std.
      #
      # `+nightly` is required, not stylistic: rust-toolchain.toml pins 1.92.0
      # and a rustup file override outranks whatever the setup action selected,
      # so a bare `cargo` here resolves to stable and rejects `-Z`.
      # Do not request a prebuilt target from rustup: tier-3 MSP430 has none,
      # and `-Z build-std=core` builds it from the rust-src component.
      - name: Build against core only
        run: cargo +nightly build --target ${{ matrix.target }} -Z build-std=core
      - name: Generated fixtures compile against core only
        run: cargo +nightly build --example no_std_generated_fixtures --target ${{ matrix.target }} -Z build-std=core

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --features gen-lib
      # `gen-lib` does not build the CLI binary, so --all-targets misses
      # src/bin/gen/main.rs without this step.
      - run: cargo clippy --all-targets --features gen-cli

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test
      - run: cargo test --features gen-lib
      - run: cargo test --features gen-cli
      # `gen` is the 0.1.x compatibility alias and must keep building the CLI.
      - run: cargo test --features gen

  feature-compat:
    name: 0.1.x feature compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The 0.1.x invocation. If `gen` ever stops producing the binary, this
      # breaks every existing user's build command.
      - name: 'cargo run --features gen still produces the CLI'
        run: cargo run --features gen --bin ph-curves-gen -- --help

  build-no-std:
    name: Build (no_std)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabi
          - thumbv6m-none-eabi
          - riscv32imac-unknown-none-elf
          - riscv32imc-unknown-none-elf    # ESP32-C3
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --target ${{ matrix.target }}
      - run: cargo build --example no_std_generated_fixtures --target ${{ matrix.target }}

  build-esp-xtensa:
    name: Build (ESP32 Xtensa)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - xtensa-esp32-none-elf
          - xtensa-esp32s2-none-elf
          - xtensa-esp32s3-none-elf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # espup queries the GitHub API for the latest Xtensa Rust release.
      # Unauthenticated that shares the anonymous per-IP quota with every other
      # runner and returns 403 under load; the token makes the call use this
      # repository's much larger quota.
      - uses: esp-rs/xtensa-toolchain@b989c80ffd4be88d30c09606ee9b449bd0d41958 # v1.5
        with:
          default: true
          ldproxy: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +esp build --target ${{ matrix.target }} -Zbuild-std=core
      - run: cargo +esp build --example no_std_generated_fixtures --target ${{ matrix.target }} -Zbuild-std=core

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # docs.rs publishes with features = ["gen-lib"] ([package.metadata.docs.rs]).
      # Without this flag, rustdoc never compiles src/gen, so a broken intra-doc
      # link there cannot fail the gate.
      - run: cargo doc --no-deps --features gen-lib

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          # RUSTFLAGS=-Dwarnings is irrelevant here and the action warns on it.
          arguments: --all-features

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo package

  # Branch protection requires one stable check name instead of depending on
  # every matrix-generated check. `always()` ensures this job reports even
  # when an upstream job fails or is cancelled.
  ci:
    if: ${{ always() }}
    needs:
      - fmt
      - runtime-purity
      - clippy
      - test
      - feature-compat
      - build-no-std
      - build-esp-xtensa
      - doc
      - deny
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more CI jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
